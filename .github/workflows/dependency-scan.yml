name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install Govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Go Vulnerability Scan
        continue-on-error: true
        run: govulncheck ./... > govulncheck-report.txt
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Node Dependency Scan
        continue-on-error: true
        run: npm audit --json > npm-audit-report.json
        working-directory: frontend

      - name: Create Reports Directory
        if: always()
        run: |
          mkdir -p reports
          cp backend/govulncheck-report.txt reports/govulncheck-report.txt || true
          cp frontend/npm-audit-report.json reports/npm-audit-report.json || true

      - name: Upload Dependency Scan Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: reports/
          retention-days: 5
